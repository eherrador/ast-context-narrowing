[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-context-narrowing"
version = "0.1.1"
description = "Narrow a code diff to the structural definition (method/function/class/field) it touched, instead of the raw hunk or the whole file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Edgar Herrador" }]
keywords = ["ast", "tree-sitter", "diff", "fine-tuning", "llm", "code-review", "dataset-curation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
parsers = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
dev = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/eherrador/ast-context-narrowing"
Issues = "https://github.com/eherrador/ast-context-narrowing/issues"

[tool.setuptools.packages.find]
include = ["ast_context_narrowing*"]
